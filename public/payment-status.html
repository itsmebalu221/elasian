<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status - Elysian 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #16161f;
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #e0e0e0;
      --text-muted: #888;
      --accent: #6b8cce;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.1);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.1);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Fixed Navbar */
    .top-navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 2rem;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .top-navbar {
        padding: 0.75rem 1rem;
      }
    }

    .navbar-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: 0.1em;
    }

    @media (max-width: 640px) {
      .navbar-brand {
        font-size: 1.25rem;
      }
    }

    .navbar-brand span {
      color: var(--accent);
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    @media (max-width: 640px) {
      .navbar-right {
        gap: 0.75rem;
      }
    }

    .user-block {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    @media (max-width: 480px) {
      .user-block {
        gap: 0.5rem;
      }
    }

    .user-avatar {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      border: 1px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    @media (max-width: 480px) {
      .user-meta {
        display: none;
      }
    }

    .user-name {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .user-email {
      font-size: 0.6875rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .signout-link {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.375rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .signout-link:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .page-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem 2rem;
    }

    @media (max-width: 640px) {
      .page-content {
        padding: 4.5rem 1rem 1.5rem;
      }
    }

    .status-container {
      max-width: 480px;
      width: 100%;
    }

    .status-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 3rem 2.5rem;
      text-align: center;
    }

    .payment-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
    }

    .payment-logo span {
      color: var(--accent);
    }

    .status-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .status-icon svg {
      width: 40px;
      height: 40px;
    }

    .status-icon.success {
      background: var(--success-bg);
      border: 2px solid var(--success);
    }

    .status-icon.success svg {
      color: var(--success);
    }

    .status-icon.failed {
      background: var(--error-bg);
      border: 2px solid var(--error);
    }

    .status-icon.failed svg {
      color: var(--error);
    }

    .status-icon.pending {
      background: var(--warning-bg);
      border: 2px solid var(--warning);
    }

    .status-icon.pending svg {
      color: var(--warning);
    }

    .status-icon.loading {
      background: rgba(107, 140, 206, 0.1);
      border: 2px solid var(--accent);
    }

    .status-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .status-title.success { color: var(--success); }
    .status-title.failed { color: var(--error); }
    .status-title.pending { color: var(--warning); }

    .status-message {
      font-size: 0.9375rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .payment-details {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      font-size: 0.875rem;
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-value {
      font-weight: 500;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, #5a7bc0 100%);
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(107, 140, 206, 0.3);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(107, 140, 206, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1000;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
      animation: confetti-fall 3s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% {
        opacity: 1;
        top: -10%;
        transform: rotate(0deg);
      }
      100% {
        opacity: 0;
        top: 100%;
        transform: rotate(720deg);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .status-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Fixed Navbar -->
  <nav class="top-navbar">
    <a href="/" class="navbar-brand">elysian<span>'26</span></a>
    <div class="navbar-right">
      <div class="user-block">
        <img id="user-avatar" class="user-avatar" src="" alt="">
        <div class="user-meta">
          <span class="user-name" id="user-name"></span>
          <span class="user-email" id="user-email"></span>
        </div>
      </div>
      <a href="/auth/logout" class="signout-link">Sign out</a>
    </div>
  </nav>

  <div class="page-content">
  <div class="status-container">
    <div class="status-card" id="status-card">
      <div class="status-icon loading" id="status-icon">
        <div class="loading-spinner"></div>
      </div>
      <h1 class="status-title" id="status-title">Verifying Payment</h1>
      <p class="status-message" id="status-message">Please wait while we confirm your payment...</p>
      <div class="payment-details" id="payment-details" style="display: none;"></div>
      <div id="action-buttons"></div>
    </div>
  </div>
  </div>

  <div class="confetti" id="confetti"></div>

  <script>
    // Get order ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id');
    const flowTypeParam = urlParams.get('type');
    let flowContext = (flowTypeParam && flowTypeParam.toLowerCase() === 'external') ? 'EXTERNAL' : 'HITAMONLY';
    let successRedirectTimeout = null;

    function scheduleDashboardRedirect(delayMs = 4000) {
      if (successRedirectTimeout) {
        clearTimeout(successRedirectTimeout);
      }

      successRedirectTimeout = setTimeout(() => {
        window.location.href = '/dashboard.html';
      }, delayMs);
    }

    function cancelDashboardRedirect() {
      if (successRedirectTimeout) {
        clearTimeout(successRedirectTimeout);
        successRedirectTimeout = null;
      }
    }

    // Load user info for navbar
    async function loadUserInfo() {
      try {
        const authRes = await fetch('/api/auth/status', { credentials: 'include' });
        const authData = await authRes.json();
        if (authData.isAuthenticated && authData.user) {
          document.getElementById('user-avatar').src = authData.user.picture || '';
          document.getElementById('user-name').textContent = authData.user.name || '';
          document.getElementById('user-email').textContent = authData.user.email || '';
        }
      } catch (e) {
        console.error('Failed to load user info:', e);
      }
    }

    async function verifyPayment() {
      if (!orderId) {
        showError('Invalid payment link. No order ID found.');
        return;
      }

      try {
        const response = await fetch(`/api/payment/verify?orderId=${orderId}`, {
          credentials: 'include'
        });
        
        // Handle authentication errors - redirect to login
        if (response.status === 401) {
          console.warn('Not authenticated, redirecting to login...');
          // Store the current URL to redirect back after login
          sessionStorage.setItem('payment_redirect', window.location.href);
          window.location.href = '/login.html';
          return;
        }
        
        if (response.status === 403) {
          showError('You are not authorized to view this payment. Please login with the correct account.');
          return;
        }
        
        const data = await response.json();

        if (data.context) {
          flowContext = data.context;
        }

        if (flowContext !== 'HITAMONLY' && flowContext !== 'EXTERNAL') {
          flowContext = 'HITAMONLY';
        }

        if (data.success && data.status === 'SUCCESS') {
          showSuccess(data);
        } else if (data.status === 'FAILED') {
          showFailed(data);
        } else {
          showPending(data);
        }
      } catch (error) {
        console.error('Verification error:', error);
        showError('Failed to verify payment. Please contact support.');
      }
    }

    function showSuccess(data) {
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const message = document.getElementById('status-message');
      const details = document.getElementById('payment-details');
      const buttons = document.getElementById('action-buttons');

      icon.className = 'status-icon success';
      icon.innerHTML = `
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      `;

      title.className = 'status-title success';
      title.textContent = 'Payment Successful!';

      const isExternal = flowContext === 'EXTERNAL';
      const registrationCode = data.registrationCode || null;

      message.textContent = isExternal
        ? 'Your external registration is confirmed. A copy of your receipt and pass instructions has been sent to your email. Redirecting you to the dashboard...'
        : 'Your registration is now complete. You can download your event pass from the dashboard. Redirecting you to the dashboard...';

      details.style.display = 'block';
      details.innerHTML = `
        <div class="detail-row">
          <span class="detail-label">Order ID</span>
          <span class="detail-value">${data.orderId}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Amount Paid</span>
          <span class="detail-value">₹${data.amount}</span>
        </div>
        ${data.paymentMethod ? `
        <div class="detail-row">
          <span class="detail-label">Payment Method</span>
          <span class="detail-value">${data.paymentMethod}</span>
        </div>
        ` : ''}
        ${registrationCode ? `
        <div class="detail-row">
          <span class="detail-label">Registration Code</span>
          <span class="detail-value">${registrationCode}</span>
        </div>
        ` : ''}
      `;

      if (isExternal) {
        buttons.innerHTML = `
          <a href="/dashboard.html" class="btn-primary">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 12l5 5L20 7"/>
            </svg>
            Go to Dashboard
          </a>
          <a href="/login.html" class="btn-secondary">Back to Login</a>
        `;
      } else {
        buttons.innerHTML = `
          <a href="/dashboard.html" class="btn-primary">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Go to Dashboard
          </a>
        `;
      }

      // Show confetti
      createConfetti();

      scheduleDashboardRedirect();
    }

    function showFailed(data) {
      cancelDashboardRedirect();
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const message = document.getElementById('status-message');
      const buttons = document.getElementById('action-buttons');

      icon.className = 'status-icon failed';
      icon.innerHTML = `
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      `;

      const isExternal = flowContext === 'EXTERNAL';

      title.className = 'status-title failed';
      title.textContent = 'Payment Failed';

      message.textContent = data.message || 'Your payment could not be processed. Please try again.';

      if (isExternal) {
        buttons.innerHTML = `
          <a href="/external-payment.html" class="btn-primary">Try Payment Again</a>
          <a href="/dashboard.html" class="btn-secondary">Go to Dashboard</a>
        `;
      } else {
        buttons.innerHTML = `
          <a href="/payment.html" class="btn-primary">Try Again</a>
          <a href="/dashboard.html" class="btn-secondary">Back to Dashboard</a>
        `;
      }
    }

    function showPending(data) {
      cancelDashboardRedirect();
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const message = document.getElementById('status-message');
      const buttons = document.getElementById('action-buttons');

      icon.className = 'status-icon pending';
      icon.innerHTML = `
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      `;

      title.className = 'status-title pending';
      title.textContent = 'Payment Pending';

      const isExternal = flowContext === 'EXTERNAL';

      message.textContent = isExternal
        ? 'Your payment is being processed. You can safely close this page and revisit the external portal with your registration ID.'
        : 'Your payment is being processed. This may take a few minutes. Please check back later.';

      if (isExternal) {
        buttons.innerHTML = `
          <button onclick="verifyPayment()" class="btn-primary">Check Again</button>
          <a href="/external-form.html" class="btn-secondary">Return to External Portal</a>
        `;
      } else {
        buttons.innerHTML = `
          <button onclick="verifyPayment()" class="btn-primary">Check Again</button>
          <a href="/dashboard.html" class="btn-secondary">Back to Dashboard</a>
        `;
      }
    }

    function showError(msg) {
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const message = document.getElementById('status-message');
      const buttons = document.getElementById('action-buttons');

      icon.className = 'status-icon failed';
      icon.innerHTML = `
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      `;

      title.className = 'status-title failed';
      title.textContent = 'Error';

      message.textContent = msg;

      buttons.innerHTML = `
        <a href="/dashboard.html" class="btn-primary">Back to Dashboard</a>
      `;
    }

    function createConfetti() {
      const container = document.getElementById('confetti');
      const colors = ['#FF6B9D', '#9B5DE5', '#00BBF9', '#00F5D4', '#FEE440', '#FF9F1C'];
      
      for (let i = 0; i < 50; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 2 + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        container.appendChild(piece);
      }

      // Remove confetti after animation
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    // Verify payment on page load
    loadUserInfo();
    verifyPayment();
  </script>

  <footer style="background: rgba(10, 10, 15, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 1.5rem; text-align: center;">
    <p style="margin: 0; color: #888; font-size: 0.75rem;">© 2026 ROYAL EDUCATIONAL SOCIETY. All rights reserved.</p>
  </footer>
</body>
</html>
