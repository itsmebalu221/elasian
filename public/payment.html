<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Elysian 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #16161f;
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #e0e0e0;
      --text-muted: #888;
      --accent: #6b8cce;
      --accent-hover: #7a9bdd;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Fixed Navbar */
    .top-navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 2rem;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .top-navbar {
        padding: 0.75rem 1rem;
      }
    }

    .navbar-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: 0.1em;
    }

    @media (max-width: 640px) {
      .navbar-brand {
        font-size: 1.25rem;
      }
    }

    .navbar-brand span {
      color: var(--accent);
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    @media (max-width: 640px) {
      .navbar-right {
        gap: 0.75rem;
      }
    }

    .user-block {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    @media (max-width: 480px) {
      .user-block {
        gap: 0.5rem;
      }
    }

    .user-avatar {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      border: 1px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    @media (max-width: 480px) {
      .user-meta {
        display: none;
      }
    }

    .user-name {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .user-email {
      font-size: 0.6875rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .signout-link {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.375rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .signout-link:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .page-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem 2rem;
    }

    @media (max-width: 640px) {
      .page-content {
        padding: 4.5rem 1rem 1.5rem;
      }
    }

    .payment-container {
      max-width: 480px;
      width: 100%;
    }

    .payment-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2.5rem;
    }

    .payment-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .payment-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .payment-logo span {
      color: var(--accent);
    }

    .payment-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .payment-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .amount-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .amount-label {
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .amount-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 600;
      color: var(--accent);
    }

    .amount-value::before {
      content: '₹';
      font-size: 2rem;
    }

    .amount-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .order-details {
      margin-bottom: 2rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-value {
      font-weight: 500;
      text-align: right;
    }

    .btn-pay {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, #5a7bc0 100%);
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-pay:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(107, 140, 206, 0.3);
    }

    .btn-pay:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-pay svg {
      width: 20px;
      height: 20px;
    }

    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .secure-badge svg {
      width: 14px;
      height: 14px;
      color: var(--success);
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: var(--error);
      text-align: center;
    }

    .info-message {
      background: rgba(107, 140, 206, 0.1);
      border: 1px solid rgba(107, 140, 206, 0.3);
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: var(--accent);
      text-align: center;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text-primary);
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .payment-card {
        padding: 1.5rem;
      }

      .amount-value {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  
  <nav class="top-navbar">
    <a href="/" class="navbar-brand">elysian<span>'26</span></a>
    <div class="navbar-right">
      <div class="user-block">
        <img id="user-avatar" class="user-avatar" src="" alt="">
        <div class="user-meta">
          <span class="user-name" id="user-name"></span>
          <span class="user-email" id="user-email"></span>
        </div>
      </div>
      <a href="/auth/logout" class="signout-link">Sign out</a>
    </div>
  </nav>

  <div class="page-content">
  <div class="payment-container">
    <div class="payment-card">
      <div class="payment-header">
        <h1 class="payment-title">Complete Payment</h1>
        <p class="payment-subtitle">Event Pass Registration Fee</p>
      </div>

      <div id="error-container"></div>
      <div id="info-container"></div>

      <div class="amount-box">
        <div class="amount-label">Total Amount</div>
        <div class="amount-value">500</div>
        <div class="amount-note">One-time registration fee (non-refundable)</div>
      </div>

      <div class="order-details" id="order-details">
        <div class="detail-row">
          <span class="detail-label">Name</span>
          <span class="detail-value" id="detail-name">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-value" id="detail-email">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Registration ID</span>
          <span class="detail-value" id="detail-reg-id">—</span>
        </div>
      </div>

      <button class="btn-pay" id="btn-pay" onclick="initiatePayment()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        Pay ₹500 Securely
      </button>

      <div class="secure-badge">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
        Secured by Cashfree Payments
      </div>

      <a href="/dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>
  </div>
  </div>

  <script>
    let formData = null;
    let paymentSessionId = null;
    let cashfreeMode = null;

    // Check authentication
    async function init() {
      try {
        // Check status
        const authRes = await fetch('/api/auth/status', {
          credentials: 'include'
        });
        const authData = await authRes.json();

        if (!authData.isAuthenticated) {
          window.location.href = '/login.html';
          return;
        }

        // External users should use external-payment.html
        if (authData.user.userType === 'EXTERNAL') {
          window.location.href = '/external-payment.html';
          return;
        }

        // Get form data
        const formRes = await fetch('/api/student/form', {
          credentials: 'include'
        });
        const formResult = await formRes.json();

        if (!formResult.success || !formResult.data) {
          showError('Please complete your registration form first');
          setTimeout(() => {
            window.location.href = '/form.html';
          }, 2000);
          return;
        }

        formData = formResult.data;

        // Check if already paid
        const paymentRes = await fetch(`/api/payment/status?formId=${formData.id}`, {
          credentials: 'include'
        });
        const paymentData = await paymentRes.json();

        if (paymentData.isPaid) {
          showInfo('Payment already completed! Redirecting to dashboard...');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 2000);
          return;
        }

        // Update UI with user details
        document.getElementById('detail-name').textContent = formData.full_name;
        document.getElementById('detail-email').textContent = authData.user.email;
        document.getElementById('detail-reg-id').textContent = formData.registration_id;
        
        // Update navbar user info
        document.getElementById('user-avatar').src = authData.user.picture || '';
        document.getElementById('user-name').textContent = formData.full_name;
        document.getElementById('user-email').textContent = authData.user.email;

      } catch (error) {
        console.error('Init error:', error);
        showError('Failed to load payment details. Please try again.');
      }
    }

    function showError(message) {
      document.getElementById('error-container').innerHTML = `
        <div class="error-message">${message}</div>
      `;
    }

    function showInfo(message) {
      document.getElementById('info-container').innerHTML = `
        <div class="info-message">${message}</div>
      `;
    }

    function deriveDefaultCashfreeMode() {
      const host = window.location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') {
        return 'sandbox';
      }
      return 'production';
    }

    function getCashfreeMode() {
      if (cashfreeMode === 'production' || cashfreeMode === 'sandbox') {
        return cashfreeMode;
      }
      return deriveDefaultCashfreeMode();
    }

    async function initiatePayment() {
      const btn = document.getElementById('btn-pay');
      
      if (!formData) {
        showError('Form data not loaded. Please refresh the page.');
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner"></div> Processing...';

        // Create order
        const response = await fetch('/api/payment/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            formId: formData.id,
            customerPhone: formData.mobile
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to create order');
        }

        paymentSessionId = data.paymentSessionId;
        if (data.mode === 'production' || data.mode === 'sandbox') {
          cashfreeMode = data.mode;
        }

        const mode = getCashfreeMode();

        // Initialize Cashfree checkout
        const cashfree = Cashfree({
          mode
        });

        const checkoutOptions = {
          paymentSessionId: paymentSessionId,
          redirectTarget: '_self'
        };

        await cashfree.checkout(checkoutOptions);

      } catch (error) {
        console.error('Payment error:', error);
        showError(error.message || 'Payment failed. Please try again.');
        btn.disabled = false;
        btn.innerHTML = `
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          Pay ₹500 Securely
        `;
      }
    }

    // Initialize on page load
    init();
  </script>

  <footer style="background: rgba(10, 10, 15, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 1.5rem; text-align: center;">
    <p style="margin: 0; color: #888; font-size: 0.75rem;">© 2026 ROYAL EDUCATIONAL SOCIETY. All rights reserved.</p>
  </footer>
</body>
</html>
