<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gate Check-In | Elysian 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0a0a0f;
      --card: #16161d;
      --border: #2a2a35;
      --text: #ffffff;
      --muted: #8b8b9a;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #3b82f6;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* ===== LOGIN SCREEN ===== */
    .login-screen {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header .logo {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .login-header p {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      text-align: center;
    }

    /* ===== MAIN APP ===== */
    .app-screen {
      display: none;
    }

    .app-screen.active {
      display: block;
    }

    header {
      text-align: center;
      padding: 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .header-left p {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .logout-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
      cursor: pointer;
    }

    .logout-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .day-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      padding: 4px;
      background: var(--card);
      border-radius: 12px;
      overflow-x: auto;
    }

    .day-btn {
      flex: 1;
      min-width: 50px;
      padding: 10px 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .day-btn.active {
      background: var(--blue);
      color: white;
    }

    .manual-lookup {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .manual-lookup input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 0.9rem;
      font-family: monospace;
      text-transform: uppercase;
    }

    .manual-lookup input::placeholder {
      color: var(--muted);
      text-transform: none;
      font-family: 'Inter', sans-serif;
    }

    .manual-lookup input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .btn-lookup {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .scanner-container {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
      min-height: 280px;
    }

    #qr-reader { width: 100%; border: none; }
    #qr-reader video { border-radius: 12px; }
    #qr-reader__scan_region { background: transparent !important; }
    #qr-reader__dashboard { display: none !important; }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--card);
      color: var(--muted);
      z-index: 10;
    }

    .scanner-overlay.hidden { display: none; }

    .scanner-overlay svg {
      width: 64px;
      height: 64px;
      opacity: 0.5;
    }

    .status-card {
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      text-align: center;
      transition: all 0.3s;
    }

    .status-card.idle { background: var(--card); border: 2px dashed var(--border); }
    .status-card.loading { background: var(--card); border: 2px solid var(--blue); }
    .status-card.valid { background: rgba(34, 197, 94, 0.15); border: 2px solid var(--green); }
    .status-card.partial { background: rgba(234, 179, 8, 0.15); border: 2px solid var(--yellow); }
    .status-card.used { background: rgba(234, 179, 8, 0.15); border: 2px solid var(--yellow); }
    .status-card.invalid { background: rgba(239, 68, 68, 0.15); border: 2px solid var(--red); }

    .status-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .status-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    .status-message { color: var(--muted); font-size: 0.8rem; }

    .pass-info {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .pass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .pass-type {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--blue);
    }

    .pass-id {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .guest-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .guest-item.admitted {
      opacity: 0.6;
      border-color: var(--green);
    }

    .guest-checkbox {
      width: 22px;
      height: 22px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .guest-info { flex: 1; }
    .guest-name { font-weight: 600; margin-bottom: 2px; font-size: 0.95rem; }
    .guest-meta { font-size: 0.7rem; color: var(--muted); }

    .guest-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .guest-badge.ready { background: rgba(59, 130, 246, 0.2); color: var(--blue); }
    .guest-badge.admitted { background: rgba(34, 197, 94, 0.2); color: var(--green); }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--green); color: white; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }

    .hidden { display: none !important; }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
      <div class="login-card">
        <div class="login-header">
          <div class="logo"><img src="/Assets/Elysian logo black.jpg" alt="Elysian" style="width: 80px; height: 80px; border-radius: 8px; object-fit: contain;"></div>
          <h1>Elysian'26 Gate Check-In</h1>
          <p>Committee Sign in</p>
        </div>

        <div id="loginError" class="login-error hidden"></div>

        <form id="loginForm" onsubmit="handleEmailLogin(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="loginEmail" placeholder="committee@elysianhitam.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter Your Password" required>
          </div>
          <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>
      </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div class="app-screen" id="appScreen">
      <header>
        <div class="header-left">
          <h1><img src="/Assets/Elysian logo black.jpg" alt="Elysian" style="width: 32px; height: 32px; border-radius: 4px; object-fit: contain; vertical-align: middle; margin-right: 8px;">Gate Check-In</h1>
          <p id="userInfo">—</p>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
      </header>

      <div class="day-selector" id="daySelector"></div>

      <div class="manual-lookup">
        <input type="text" id="manualIdInput" placeholder="Registration ID (e.g., BUTTERFLY001)" />
        <button class="btn-lookup" onclick="manualLookup()">🔍</button>
      </div>

      <div class="scanner-container">
        <div id="qr-reader"></div>
        <div class="scanner-overlay" id="scannerOverlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>
            <rect x="7" y="7" width="10" height="10" rx="1"/>
          </svg>
          <p id="overlayText">Loading camera...</p>
          <button class="btn btn-secondary" id="startCamBtn" onclick="initScanner()" style="display:none;">Start Camera</button>
        </div>
      </div>

      <div id="errorBox" class="error-box hidden"></div>

      <div class="status-card idle" id="statusCard">
        <div class="status-icon" id="statusIcon">📷</div>
        <div class="status-title" id="statusTitle">Ready to Scan</div>
        <div class="status-message" id="statusMessage">Point camera at a QR code</div>
      </div>

      <div id="passInfo" class="pass-info hidden">
        <div class="pass-header">
          <span class="pass-type" id="passType">—</span>
          <span class="pass-id" id="passId">—</span>
        </div>
        <div class="guest-list" id="guestList"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="admitBtn" onclick="admitSelected()" disabled>✓ Admit Selected</button>
        <button class="btn btn-secondary" id="scanNextBtn" onclick="resetAndScan()">↻ Next</button>
      </div>
    </div>
  </div>

  <script>
    // ===== STATE =====
    let scanner = null;
    let currentDay = 'day1';
    let currentResult = null;
    let selectedIds = new Set();
    let isScanning = false;
    let libLoaded = false;
    let currentUser = null;
    let loginInProgress = false;
    let loginFailCount = 0;
    let loginCooldownUntil = 0;
    let loginCooldownTimer = null;
    let lookupInProgress = false;
    let admitInProgress = false;
    let lastLookupValue = null;
    let lastLookupAt = 0;
    let scannerInitInProgress = false;

    const LOOKUP_COOLDOWN_MS = 1500;
    const ADMIT_COOLDOWN_MS = 1500;

    // ===== ELEMENTS =====
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    const userInfo = document.getElementById('userInfo');
    const daySelector = document.getElementById('daySelector');
    const statusCard = document.getElementById('statusCard');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusMessage = document.getElementById('statusMessage');
    const passInfo = document.getElementById('passInfo');
    const passType = document.getElementById('passType');
    const passId = document.getElementById('passId');
    const guestList = document.getElementById('guestList');
    const admitBtn = document.getElementById('admitBtn');
    const errorBox = document.getElementById('errorBox');
    const scannerOverlay = document.getElementById('scannerOverlay');
    const overlayText = document.getElementById('overlayText');
    const startCamBtn = document.getElementById('startCamBtn');
    const manualIdInput = document.getElementById('manualIdInput');

    function setLoginButtonState(disabled, text) {
      loginBtn.disabled = disabled;
      loginBtn.textContent = text;
    }

    function startLoginCooldown(durationMs) {
      loginCooldownUntil = Date.now() + durationMs;
      if (loginCooldownTimer) {
        clearInterval(loginCooldownTimer);
      }

      const update = () => {
        const remainingMs = Math.max(0, loginCooldownUntil - Date.now());
        const remainingSeconds = Math.ceil(remainingMs / 1000);

        if (remainingMs <= 0) {
          clearInterval(loginCooldownTimer);
          loginCooldownTimer = null;
          loginFailCount = 0;
          setLoginButtonState(false, 'Sign In');
          return;
        }

        setLoginButtonState(true, `Try again in ${remainingSeconds}s`);
      };

      update();
      loginCooldownTimer = setInterval(update, 1000);
    }

    // ===== AUTH =====
    async function checkSession() {
      try {
        const res = await fetch('/api/checkin/session', { credentials: 'include' });
        const data = await res.json();
        if (data.success && data.authenticated) {
          currentUser = data.user;
          showApp();
          return true;
        }
      } catch (e) {
        console.warn('Session check failed:', e);
      }
      showLogin();
      return false;
    }

    // Email/Password login via env credentials
    async function handleEmailLogin(e) {
      e.preventDefault();

      if (loginInProgress) {
        return;
      }

      if (Date.now() < loginCooldownUntil) {
        const waitSeconds = Math.ceil((loginCooldownUntil - Date.now()) / 1000);
        showLoginError(`Please wait ${waitSeconds}s before trying again.`);
        return;
      }
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showLoginError('Enter email and password');
        return;
      }

      loginInProgress = true;
      setLoginButtonState(true, 'Signing in...');
      hideLoginError();

      try {
        const res = await fetch('/api/checkin/login-basic', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (data.success && data.user) {
          currentUser = data.user;
          showApp();
          loginFailCount = 0;
        } else {
          throw new Error(data.error || 'Login failed');
        }

      } catch (err) {
        console.error('Login error:', err);
        let msg = 'Login failed';
        if (err.message) msg = err.message;
        showLoginError(msg);

        loginFailCount += 1;
        if (loginFailCount >= 3) {
          startLoginCooldown(30000);
        }
      } finally {
        loginInProgress = false;
        if (Date.now() >= loginCooldownUntil) {
          setLoginButtonState(false, 'Sign In');
        }
      }
    }

    async function handleLogout() {
      try {
        await fetch('/api/checkin/logout', { method: 'POST', credentials: 'include' });
      } catch (e) {}
      
      currentUser = null;
      await stopScanner();
      showLogin();
    }

    function showLogin() {
      loginScreen.style.display = 'flex';
      appScreen.classList.remove('active');
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
    }

    function showApp() {
      loginScreen.style.display = 'none';
      appScreen.classList.add('active');
      userInfo.textContent = currentUser?.email || '—';
      loadConfig();
      initScanner();
    }

    function showLoginError(msg) {
      loginError.textContent = msg;
      loginError.classList.remove('hidden');
    }

    function hideLoginError() {
      loginError.classList.add('hidden');
    }

    // ===== API =====
    async function apiCall(url, options = {}) {
      const res = await fetch(url, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await res.json();
      
      if (res.status === 401 || res.status === 403) {
        showLogin();
        throw new Error('Session expired');
      }
      
      if (!res.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Request failed');
      }
      return data.result || data.config || data;
    }

    // ===== CONFIG =====
    async function loadConfig() {
      try {
        const config = await apiCall('/api/checkin/config');
        renderDaySelector(config.dayOptions, config.defaultDay);
        currentDay = config.defaultDay;
      } catch (err) {
        console.warn('Config load failed:', err.message);
        const fallbackDays = Array.from({length: 7}, (_, i) => ({id: `day${i+1}`, label: `D${i+1}`}));
        renderDaySelector(fallbackDays, 'day1');
      }
    }

    function renderDaySelector(days, defaultDay) {
      daySelector.innerHTML = days.map(day => `
        <button class="day-btn ${day.id === defaultDay ? 'active' : ''}" 
                data-day="${day.id}" onclick="selectDay('${day.id}')">
          ${day.label}
        </button>
      `).join('');
    }

    function selectDay(dayId) {
      currentDay = dayId;
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.day === dayId);
      });
      if (currentResult) resetAndScan();
    }

    // ===== QR SCANNER =====
    function loadQrLib() {
      return new Promise((resolve, reject) => {
        if (typeof Html5Qrcode !== 'undefined') {
          libLoaded = true;
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        script.onload = () => { libLoaded = true; resolve(); };
        script.onerror = () => reject(new Error('Failed to load QR library'));
        document.head.appendChild(script);
      });
    }

    async function initScanner() {
      if (scannerInitInProgress) return;
      scannerInitInProgress = true;
      overlayText.textContent = 'Starting camera...';
      startCamBtn.style.display = 'none';
      scannerOverlay.classList.remove('hidden');

      try {
        if (!libLoaded) {
          overlayText.textContent = 'Loading scanner...';
          await loadQrLib();
        }

        if (!scanner) {
          scanner = new Html5Qrcode('qr-reader');
        }

        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          throw new Error('No camera found');
        }

        const backCam = cameras.find(c => /back|rear|environment/i.test(c.label));
        const selectedCam = backCam || cameras[0];

        await scanner.start(
          selectedCam.id,
          { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
          onScanSuccess,
          () => {}
        );

        isScanning = true;
        scannerOverlay.classList.add('hidden');
        setStatus('idle', '📷', 'Ready to Scan', 'Point camera at a QR code');

      } catch (err) {
        console.error('Scanner error:', err);
        overlayText.textContent = err.message || 'Camera error';
        startCamBtn.style.display = 'block';
        showError('Camera: ' + err.message);
      } finally {
        scannerInitInProgress = false;
      }
    }

    async function stopScanner() {
      if (scanner && isScanning) {
        try { await scanner.stop(); isScanning = false; } catch (e) {}
      }
    }

    async function onScanSuccess(decodedText) {
      if (!isScanning || lookupInProgress) return;
      await stopScanner();
      await doLookup(decodedText, false);
    }

    // ===== LOOKUP =====
    async function manualLookup() {
      const regId = manualIdInput.value.trim();
      if (!regId) {
        showError('Enter a registration ID');
        return;
      }
      if (lookupInProgress) return;
      await stopScanner();
      scannerOverlay.classList.remove('hidden');
      overlayText.textContent = 'Looking up...';
      await doLookup(regId, true);
    }

    async function doLookup(value, isDirect) {
      if (lookupInProgress) return;
      const now = Date.now();
      const normalizedValue = value?.toString().trim().toUpperCase();
      if (normalizedValue && lastLookupValue === normalizedValue && (now - lastLookupAt) < LOOKUP_COOLDOWN_MS) {
        return;
      }

      lookupInProgress = true;
      lastLookupValue = normalizedValue;
      lastLookupAt = now;
      setStatus('loading', '', 'Verifying...', value.toUpperCase());
      hideError();

      try {
        const body = isDirect 
          ? { registrationId: value, day: currentDay }
          : { token: value, day: currentDay };

        const result = await apiCall('/api/checkin/lookup', {
          method: 'POST',
          body: JSON.stringify(body)
        });

        currentResult = result;
        renderResult(result);
        manualIdInput.value = '';

      } catch (err) {
        setStatus('invalid', '❌', 'Not Found', err.message);
        passInfo.classList.add('hidden');
        admitBtn.disabled = true;
      } finally {
        lookupInProgress = false;
      }
    }

    manualIdInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); manualLookup(); }
    });

    // ===== RENDER =====
    function renderResult(result) {
      const statusMap = {
        'VALID': { cls: 'valid', icon: '✅', title: 'Valid Pass' },
        'PARTIAL': { cls: 'partial', icon: '⚠️', title: 'Partially Admitted' },
        'ALREADY_USED': { cls: 'used', icon: '🔄', title: 'All Admitted' }
      };
      const s = statusMap[result.status] || { cls: 'valid', icon: '✅', title: 'Valid' };
      setStatus(s.cls, s.icon, s.title, result.message || '');

      passInfo.classList.remove('hidden');
      passType.textContent = result.meta?.passLabel || result.passType || 'Pass';
      passId.textContent = '#' + result.registrationId;

      selectedIds.clear();
      guestList.innerHTML = result.participants.map((p, i) => {
        const isAdmitted = p.status === 'admitted';
        const canSelect = p.canAdmit && p.attendanceId;
        if (canSelect) selectedIds.add(p.attendanceId);

        return `
          <div class="guest-item ${isAdmitted ? 'admitted' : ''}">
            <input type="checkbox" class="guest-checkbox" 
                   data-id="${p.attendanceId || ''}"
                   ${canSelect ? 'checked' : ''}
                   ${!canSelect ? 'disabled' : ''}
                   onchange="toggleGuest(${p.attendanceId}, this.checked)">
            <div class="guest-info">
              <div class="guest-name">${escapeHtml(p.name) || 'Guest ' + (i + 1)}</div>
              <div class="guest-meta">${escapeHtml(p.rollNumber || p.email || '—')}</div>
            </div>
            <span class="guest-badge ${isAdmitted ? 'admitted' : 'ready'}">
              ${isAdmitted ? '✓ In' : 'Ready'}
            </span>
          </div>
        `;
      }).join('');

      updateAdmitButton();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function toggleGuest(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      updateAdmitButton();
    }

    function updateAdmitButton() {
      const count = selectedIds.size;
      admitBtn.disabled = count === 0;
      admitBtn.textContent = count > 0 ? `✓ Admit ${count}` : '✓ Admit Selected';
    }

    // ===== ADMIT =====
    async function admitSelected() {
      if (selectedIds.size === 0) return;
      if (admitInProgress) return;
      const now = Date.now();
      if (now - lastLookupAt < ADMIT_COOLDOWN_MS) {
        return;
      }

      admitInProgress = true;

      admitBtn.disabled = true;
      admitBtn.textContent = 'Admitting...';
      hideError();

      try {
        const result = await apiCall('/api/checkin/admit', {
          method: 'POST',
          body: JSON.stringify({ 
            attendanceIds: Array.from(selectedIds), 
            day: currentDay,
            passType: currentResult?.passType || null
          })
        });

        currentResult = result;
        renderResult(result);
        setStatus('valid', '✅', 'Admitted!', result.message || 'Success');

      } catch (err) {
        showError('Admit failed: ' + err.message);
        updateAdmitButton();
      } finally {
        admitInProgress = false;
      }
    }

    function resetAndScan() {
      currentResult = null;
      selectedIds.clear();
      passInfo.classList.add('hidden');
      admitBtn.disabled = true;
      admitBtn.textContent = '✓ Admit Selected';
      hideError();
      setStatus('idle', '📷', 'Ready to Scan', 'Point camera at a QR code');
      scannerOverlay.classList.remove('hidden');
      initScanner();
    }

    // ===== HELPERS =====
    function setStatus(type, icon, title, message) {
      statusCard.className = 'status-card ' + type;
      statusIcon.innerHTML = type === 'loading' ? '<div class="spinner"></div>' : icon;
      statusTitle.textContent = title;
      statusMessage.textContent = message;
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      errorBox.classList.add('hidden');
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', checkSession);
  </script>
</body>
</html>
