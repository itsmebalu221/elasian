<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gate Check-In | Elysian 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0a0a0f;
      --card: #16161d;
      --border: #2a2a35;
      --text: #ffffff;
      --muted: #8b8b9a;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #3b82f6;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 20px 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    header p {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .day-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding: 4px;
      background: var(--card);
      border-radius: 12px;
      overflow-x: auto;
    }

    .day-btn {
      flex: 1;
      min-width: 60px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .day-btn.active {
      background: var(--blue);
      color: white;
    }

    .manual-lookup {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .manual-lookup input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 0.9rem;
      font-family: monospace;
      text-transform: uppercase;
    }

    .manual-lookup input::placeholder {
      color: var(--muted);
      text-transform: none;
      font-family: 'Inter', sans-serif;
    }

    .manual-lookup input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .btn-lookup {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-lookup:hover {
      opacity: 0.9;
    }

    .scanner-container {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    #qr-reader {
      width: 100%;
      border: none;
    }

    #qr-reader video {
      border-radius: 12px;
    }

    #qr-reader__scan_region {
      background: transparent !important;
    }

    #qr-reader__dashboard {
      display: none !important;
    }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--card);
      color: var(--muted);
      z-index: 10;
    }

    .scanner-overlay.hidden {
      display: none;
    }

    .scanner-overlay svg {
      width: 64px;
      height: 64px;
      opacity: 0.5;
    }

    .status-card {
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      text-align: center;
      transition: all 0.3s;
    }

    .status-card.idle {
      background: var(--card);
      border: 2px dashed var(--border);
    }

    .status-card.loading {
      background: var(--card);
      border: 2px solid var(--blue);
    }

    .status-card.valid {
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid var(--green);
    }

    .status-card.partial {
      background: rgba(234, 179, 8, 0.15);
      border: 2px solid var(--yellow);
    }

    .status-card.used {
      background: rgba(234, 179, 8, 0.15);
      border: 2px solid var(--yellow);
    }

    .status-card.invalid {
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid var(--red);
    }

    .status-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .status-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .status-message {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .pass-info {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .pass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .pass-type {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--blue);
    }

    .pass-id {
      font-family: monospace;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .guest-item.admitted {
      opacity: 0.6;
      border-color: var(--green);
    }

    .guest-checkbox {
      width: 22px;
      height: 22px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .guest-info {
      flex: 1;
    }

    .guest-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .guest-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .guest-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .guest-badge.ready {
      background: rgba(59, 130, 246, 0.2);
      color: var(--blue);
    }

    .guest-badge.admitted {
      background: rgba(34, 197, 94, 0.2);
      color: var(--green);
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .hidden { display: none !important; }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.875rem;
    }

    @media (max-width: 400px) {
      .day-btn { min-width: 50px; padding: 8px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎫 Gate Check-In</h1>
      <p>Scan QR codes to verify and admit guests</p>
    </header>

    <div class="day-selector" id="daySelector"></div>

    <!-- Manual ID lookup -->
    <div class="manual-lookup">
      <input type="text" id="manualIdInput" placeholder="Enter Registration ID (e.g., BUTTERFLY001)" />
      <button class="btn-lookup" onclick="manualLookup()">🔍</button>
    </div>

    <div class="scanner-container">
      <div id="qr-reader"></div>
      <div class="scanner-overlay" id="scannerOverlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>
          <rect x="7" y="7" width="10" height="10" rx="1"/>
        </svg>
        <p id="overlayText">Loading camera...</p>
        <button class="btn btn-secondary" id="startCamBtn" onclick="initScanner()" style="display:none;">Start Camera</button>
      </div>
    </div>

    <div id="errorBox" class="error-box hidden"></div>

    <div class="status-card idle" id="statusCard">
      <div class="status-icon" id="statusIcon">📷</div>
      <div class="status-title" id="statusTitle">Ready to Scan</div>
      <div class="status-message" id="statusMessage">Point camera at a QR code</div>
    </div>

    <div id="passInfo" class="pass-info hidden">
      <div class="pass-header">
        <span class="pass-type" id="passType">—</span>
        <span class="pass-id" id="passId">—</span>
      </div>
      <div class="guest-list" id="guestList"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="admitBtn" onclick="admitSelected()" disabled>
        ✓ Admit Selected
      </button>
      <button class="btn btn-secondary" id="scanNextBtn" onclick="resetAndScan()">
        ↻ Scan Next
      </button>
    </div>
  </div>

  <script>
    // State
    let scanner = null;
    let currentDay = 'day1';
    let currentResult = null;
    let selectedIds = new Set();
    let isScanning = false;
    let libLoaded = false;

    // Elements
    const daySelector = document.getElementById('daySelector');
    const statusCard = document.getElementById('statusCard');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusMessage = document.getElementById('statusMessage');
    const passInfo = document.getElementById('passInfo');
    const passType = document.getElementById('passType');
    const passId = document.getElementById('passId');
    const guestList = document.getElementById('guestList');
    const admitBtn = document.getElementById('admitBtn');
    const errorBox = document.getElementById('errorBox');
    const scannerOverlay = document.getElementById('scannerOverlay');
    const overlayText = document.getElementById('overlayText');
    const startCamBtn = document.getElementById('startCamBtn');
    const manualIdInput = document.getElementById('manualIdInput');

    // Manual lookup by registration ID
    async function manualLookup() {
      const regId = manualIdInput.value.trim();
      if (!regId) {
        showError('Enter a registration ID');
        return;
      }

      // Stop scanner if running
      await stopScanner();
      scannerOverlay.classList.remove('hidden');
      overlayText.textContent = 'Lookup in progress...';

      setStatus('loading', '', 'Looking up...', regId.toUpperCase());
      hideError();

      try {
        const result = await apiCall('/api/checkin/lookup', {
          method: 'POST',
          body: JSON.stringify({ registrationId: regId, day: currentDay })
        });

        currentResult = result;
        renderResult(result);
        manualIdInput.value = '';

      } catch (err) {
        setStatus('invalid', '❌', 'Not Found', err.message);
        passInfo.classList.add('hidden');
        admitBtn.disabled = true;
      }
    }

    // Allow Enter key to trigger lookup
    manualIdInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        manualLookup();
      }
    });

    // Load html5-qrcode library dynamically
    function loadQrLib() {
      return new Promise((resolve, reject) => {
        if (typeof Html5Qrcode !== 'undefined') {
          libLoaded = true;
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        script.onload = () => {
          libLoaded = true;
          resolve();
        };
        script.onerror = () => reject(new Error('Failed to load QR scanner library'));
        document.head.appendChild(script);
      });
    }

    // API calls
    async function apiCall(url, options = {}) {
      const res = await fetch(url, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await res.json();
      if (!res.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Request failed');
      }
      return data.result || data.config || data;
    }

    // Load config and setup days
    async function loadConfig() {
      try {
        const config = await apiCall('/api/checkin/config');
        renderDaySelector(config.dayOptions, config.defaultDay);
        currentDay = config.defaultDay;
      } catch (err) {
        console.warn('Config load failed, using fallback:', err.message);
        // Fallback days
        const fallbackDays = Array.from({length: 7}, (_, i) => ({id: `day${i+1}`, label: `D${i+1}`}));
        renderDaySelector(fallbackDays, 'day1');
      }
    }

    function renderDaySelector(days, defaultDay) {
      daySelector.innerHTML = days.map(day => `
        <button class="day-btn ${day.id === defaultDay ? 'active' : ''}" 
                data-day="${day.id}" onclick="selectDay('${day.id}')">
          ${day.label}
        </button>
      `).join('');
    }

    function selectDay(dayId) {
      currentDay = dayId;
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.day === dayId);
      });
      if (currentResult) {
        resetAndScan();
      }
    }

    // Scanner
    async function initScanner() {
      overlayText.textContent = 'Starting camera...';
      startCamBtn.style.display = 'none';

      try {
        // Load library if needed
        if (!libLoaded) {
          overlayText.textContent = 'Loading scanner...';
          await loadQrLib();
        }

        if (!scanner) {
          scanner = new Html5Qrcode('qr-reader');
        }

        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          throw new Error('No camera found on this device');
        }

        // Prefer back camera on mobile
        const backCam = cameras.find(c => /back|rear|environment/i.test(c.label));
        const selectedCam = backCam || cameras[0];

        await scanner.start(
          selectedCam.id,
          {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
          },
          onScanSuccess,
          () => {} // Ignore errors during scanning
        );

        isScanning = true;
        scannerOverlay.classList.add('hidden');
        setStatus('idle', '📷', 'Ready to Scan', 'Point camera at a QR code');

      } catch (err) {
        console.error('Scanner init error:', err);
        overlayText.textContent = err.message || 'Camera error';
        startCamBtn.style.display = 'block';
        showError('Camera: ' + err.message);
      }
    }

    async function stopScanner() {
      if (scanner && isScanning) {
        try {
          await scanner.stop();
          isScanning = false;
        } catch (e) {
          console.warn('Stop scanner error:', e);
        }
      }
    }

    async function onScanSuccess(decodedText) {
      if (!isScanning) return;
      
      // Pause scanner
      await stopScanner();
      
      setStatus('loading', '', 'Verifying...', 'Looking up pass');
      hideError();

      try {
        const result = await apiCall('/api/checkin/lookup', {
          method: 'POST',
          body: JSON.stringify({ token: decodedText, day: currentDay })
        });

        currentResult = result;
        renderResult(result);

      } catch (err) {
        setStatus('invalid', '❌', 'Invalid QR', err.message);
        passInfo.classList.add('hidden');
        admitBtn.disabled = true;
      }
    }

    function renderResult(result) {
      // Set status based on result
      const statusMap = {
        'VALID': { cls: 'valid', icon: '✅', title: 'Valid Pass' },
        'PARTIAL': { cls: 'partial', icon: '⚠️', title: 'Partially Admitted' },
        'ALREADY_USED': { cls: 'used', icon: '🔄', title: 'All Admitted' }
      };
      const s = statusMap[result.status] || { cls: 'valid', icon: '✅', title: 'Valid' };
      setStatus(s.cls, s.icon, s.title, result.message || '');

      // Show pass info
      passInfo.classList.remove('hidden');
      passType.textContent = result.meta?.passLabel || result.passType || 'Pass';
      passId.textContent = '#' + result.registrationId;

      // Render guests
      selectedIds.clear();
      guestList.innerHTML = result.participants.map((p, i) => {
        const isAdmitted = p.status === 'admitted';
        const canSelect = p.canAdmit && p.attendanceId;
        
        if (canSelect) {
          selectedIds.add(p.attendanceId);
        }

        return `
          <div class="guest-item ${isAdmitted ? 'admitted' : ''}">
            <input type="checkbox" class="guest-checkbox" 
                   data-id="${p.attendanceId || ''}"
                   ${canSelect ? 'checked' : ''}
                   ${!canSelect ? 'disabled' : ''}
                   onchange="toggleGuest(${p.attendanceId}, this.checked)">
            <div class="guest-info">
              <div class="guest-name">${escapeHtml(p.name) || 'Guest ' + (i + 1)}</div>
              <div class="guest-meta">${escapeHtml(p.rollNumber || p.email || '—')}</div>
            </div>
            <span class="guest-badge ${isAdmitted ? 'admitted' : 'ready'}">
              ${isAdmitted ? '✓ In' : 'Ready'}
            </span>
          </div>
        `;
      }).join('');

      updateAdmitButton();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function toggleGuest(id, checked) {
      if (checked) {
        selectedIds.add(id);
      } else {
        selectedIds.delete(id);
      }
      updateAdmitButton();
    }

    function updateAdmitButton() {
      const count = selectedIds.size;
      admitBtn.disabled = count === 0;
      admitBtn.textContent = count > 0 
        ? `✓ Admit ${count} Guest${count > 1 ? 's' : ''}`
        : '✓ Admit Selected';
    }

    async function admitSelected() {
      if (selectedIds.size === 0) return;

      admitBtn.disabled = true;
      admitBtn.textContent = 'Admitting...';
      hideError();

      try {
        const result = await apiCall('/api/checkin/admit', {
          method: 'POST',
          body: JSON.stringify({
            attendanceIds: Array.from(selectedIds),
            day: currentDay
          })
        });

        currentResult = result;
        renderResult(result);
        setStatus('valid', '✅', 'Admitted!', result.message || 'Success');

      } catch (err) {
        showError('Admit failed: ' + err.message);
        updateAdmitButton();
      }
    }

    function resetAndScan() {
      currentResult = null;
      selectedIds.clear();
      passInfo.classList.add('hidden');
      admitBtn.disabled = true;
      admitBtn.textContent = '✓ Admit Selected';
      hideError();
      setStatus('idle', '📷', 'Ready to Scan', 'Point camera at a QR code');
      
      // Show overlay while starting
      scannerOverlay.classList.remove('hidden');
      initScanner();
    }

    function setStatus(type, icon, title, message) {
      statusCard.className = 'status-card ' + type;
      statusIcon.innerHTML = type === 'loading' ? '<div class="spinner"></div>' : icon;
      statusTitle.textContent = title;
      statusMessage.textContent = message;
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      errorBox.classList.add('hidden');
    }

    // Init
    document.addEventListener('DOMContentLoaded', async () => {
      await loadConfig();
      initScanner();
    });
  </script>
</body>
</html>
